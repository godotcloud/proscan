# .github/workflows/ios-build.yml
# -----------------------------------------------------------------------------
# ProScan3D 免解压全自动编译打包流水线 (适配 macos-15 / Xcode 16，已彻底弃用 macos-14)
#
# 核心特性（三重“免解压”设计）：
# 1. 源码免解压上传：
#    - 方式 A：您只需将本单个 yml 文件放入空仓库的 `.github/workflows/ios-build.yml`，它已内嵌完整工程源码，会自动还原全部 Swift + Metal 源码并编译！
#    - 方式 B：如果您把 `ProScan3D-iOS-iPhone13ProMax.zip` 直接原封不动上传到 GitHub 仓库根目录（不本地解压），流水线也会自动识别并在云端解压编译！
# 2. 产物免解压直链下载：
#    - GitHub Actions 底部的 Artifacts 默认会被 GitHub 强制套一层 zip。
#    - 本流水线新增了【自动发布到 GitHub Releases】步骤，编译完成后直接去仓库右侧的 "Releases" 页面即可直接点击下载裸 `.ipa` 文件 (`ProScan3D-iPhone13ProMax-Unsigned.ipa`)，无需二次解压！
# -----------------------------------------------------------------------------

name: ProScan3D Auto-Unpack & Build IPA (macOS 15)

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      sign_build:
        description: "是否使用 Apple Developer 证书签名 (默认 false 生成免签 IPA)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      create_release:
        description: "是否自动发布到 GitHub Releases (直接下载免解压 .ipa)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build-proscan3d-macos15:
    name: Build ProScan3D on macOS-15 (Xcode 16 arm64)
    runs-on: macos-15
    env:
      PROJECT_NAME: "ProScan3D"
      SCHEME_NAME: "ProScan3D"
      BUILD_CONFIG: "Release"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Detect & Unpack Project Sources (Zero-Unzip Support)
        shell: bash
        run: |
          set -e
          echo "=== 检查仓库源码状态 ==="
          if [ -f "project.yml" ] && [ -d "Sources" ]; then
            echo "✅ 检测到已展开的工程目录 (project.yml + Sources/)，直接进入构建。"
          elif ls *.zip 1> /dev/null 2>&1; then
            FOUND_ZIP=$(ls *.zip | head -n 1)
            echo "📦 检测到仓库中直接上传了压缩包 [$FOUND_ZIP]，正在云端自动解压..."
            unzip -oq "$FOUND_ZIP" -d .
            if [ ! -f "project.yml" ]; then
              # 如果 zip 内含有一层子目录，自动将其内容平铺到当前工作区
              SUBDIR=$(find . -maxdepth 2 -name "project.yml" -exec dirname {} \; | head -n 1)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                cp -R "$SUBDIR"/* .
              fi
            fi
            echo "✅ 压缩包 [$FOUND_ZIP] 自动解压完成！"
          else
            echo "🚀 未检测到外部源码文件，正在从本工作流内嵌载荷自动释放完整 ProScan3D iOS 工程..."
            cat << 'EOF_B64' > "${RUNNER_TEMP}/embedded_project.b64"
