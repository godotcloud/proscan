            sed -i "" "s/\* stride +/* rowStride +/g" Sources/Core/*.swift 2>/dev/null || sed -i "s/\* stride +/* rowStride +/g" Sources/Core/*.swift || true
          fi
          ls -la
          ls -la Sources/

      - name: 3. Verify macOS 15 & Select Xcode 16
        run: |
          echo "=== Runner OS Version (macOS 15 Sequoia) ==="
          sw_vers
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 4. Generate Xcode Project via XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml
          ls -la "${PROJECT_NAME}.xcodeproj"

      # =========================================================================
      # 模式 A: 免签名真机编译打包 (Unsigned IPA) - 默认执行
      # =========================================================================
      - name: 5A. Compile Unsigned Release Binary (iphoneos arm64)
        if: ${{ github.event.inputs.sign_build != 'true' }}
        run: |
          xcodebuild clean build \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -sdk iphoneos \
            -configuration "${BUILD_CONFIG}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6A. Ad-Hoc Pseudo-Sign & Package IPA
        if: ${{ github.event.inputs.sign_build != 'true' }}
        run: |
          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/${BUILD_CONFIG}-iphoneos/${PROJECT_NAME}.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "❌ 错误: 未找到编译产物 ${APP_PATH}"
            exit 1
          fi

          # Ad-hoc 伪签名，兼容 Sideloadly / AltStore / SideStore / TrollStore
          codesign --force --deep --sign - "${APP_PATH}" || true

          STAGE_DIR="${RUNNER_TEMP}/ipa_stage"
          mkdir -p "${STAGE_DIR}/Payload"
          cp -R "${APP_PATH}" "${STAGE_DIR}/Payload/"

          cd "${STAGE_DIR}"
          zip -qry "${GITHUB_WORKSPACE}/${PROJECT_NAME}-iPhone13ProMax-Unsigned.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/${PROJECT_NAME}-iPhone13ProMax-Unsigned.ipa"

      # =========================================================================
      # 模式 B: 自有 Apple Developer 证书签名打包 (Signed IPA) - 按需开启
      # =========================================================================
      - name: 5B. Import Apple Signing Certificate & Provisioning Profile
        if: ${{ github.event.inputs.sign_build == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          PP_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PP_PATH"))
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: 6B. Archive & Export Signed IPA
        if: ${{ github.event.inputs.sign_build == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD || 'development' }}
        run: |
          cat <<EOF > "${RUNNER_TEMP}/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -sdk iphoneos \
            -configuration "${BUILD_CONFIG}" \
            -archivePath "${RUNNER_TEMP}/${PROJECT_NAME}.xcarchive" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/${PROJECT_NAME}.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${GITHUB_WORKSPACE}"

      - name: 7B. Cleanup Temporary Keychain
        if: ${{ always() && github.event.inputs.sign_build == 'true' }}
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"

      # =========================================================================
      # 产物分发 1: 自动发布到 GitHub Releases (支持直接点击下载免解压的裸 .ipa 文件)
      # =========================================================================
      - name: 8. Publish Direct-Downloadable .ipa to GitHub Releases (No Unzip Required)
        if: ${{ github.event.inputs.create_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="ProScan 3D (iPhone 13 Pro Max) Build #${{ github.run_number }}"
          gh release create "$TAG_NAME" ${GITHUB_WORKSPACE}/*.ipa \
            --title "$RELEASE_TITLE" \
            --notes "面向 iPhone 13 Pro Max 的高精度 LiDAR + RGB + ObjectCapture + TrueDepth 3D 扫描安装包。可直接点击下方 .ipa 文件下载（免解压），并使用 Sideloadly / AltStore / TrollStore 安装至手机。" || true

      # =========================================================================
      # 产物分发 2: 同时上传至 GitHub Actions Artifacts 备份
      # =========================================================================
      - name: 9. Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProScan3D-iPhone13ProMax-IPA-${{ github.run_number }}
          path: ${{ github.workspace }}/*.ipa
          compression-level: 0
          retention-days: 30
